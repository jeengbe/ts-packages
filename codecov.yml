coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: cache
      name: cache
      paths:
        - packages/cache
    - component_id: config
      name: config
      paths:
        - packages/config
    - component_id: prelude
      name: prelude
      paths:
        - packages/prelude
    - component_id: spiffe
      name: spiffe
      paths:
        - packages/spiffe
comment:
  layout: condensed_header, components, condensed_files, condensed_footer
  require_changes: false
